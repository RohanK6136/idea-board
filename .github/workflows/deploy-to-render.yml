name: Deploy to Render

on:
  workflow_dispatch:
    inputs:
      service_id:
        description: 'Optional: override RENDER_SERVICE_ID secret'
        required: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ github.event.inputs.service_id || secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ]; then echo 'Missing RENDER_API_KEY secret'; exit 1; fi
          if [ -z "$RENDER_SERVICE_ID" ]; then echo 'Missing RENDER_SERVICE_ID secret or input'; exit 1; fi
          echo "Triggering deploy for service: $RENDER_SERVICE_ID"
          resp=$(curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' )
          echo "Render response: $resp"
          echo "$resp" > render-deploy-response.json
      - name: Upload response
        uses: actions/upload-artifact@v4
        with:
          name: render-deploy-response
          path: render-deploy-response.json
